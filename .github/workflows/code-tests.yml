name: Code Tests
on: workflow_call

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: |
                      frontend/package-lock.json
                      backend/package-lock.json
            - name: Install actionlint
              run: |
                  curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL --retry 3 --retry-all-errors \
                    -o /tmp/actionlint.tar.gz \
                    https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
                  echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
                  tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
            - name: Lint GitHub Actions workflows
              run: /tmp/actionlint -color .github/workflows/*.yml
            - name: Validate bootstrap shell syntax
              run: bash -n bootstrap.sh start.sh scripts/*.sh
            - name: Test Frontend
              run: |
                  cd frontend
                  npm ci --legacy-peer-deps
                  CI=true npm test -- --watchAll=false
            - name: Build Frontend
              run: |
                  cd frontend
                  npm run build
            - name: Test Backend
              run: |
                  cd backend
                  npm ci
                  npm test
            - name: Validate Prometheus rules and Grafana dashboards
              run: |
                  python3 -m venv /tmp/observability-venv
                  /tmp/observability-venv/bin/pip install --disable-pip-version-check --no-input --only-binary=:all: PyYAML==6.0.4 promql-parser==0.12.0
                  /tmp/observability-venv/bin/python -m unittest data-loader/test_validate_observability.py
                  /tmp/observability-venv/bin/python scripts/validate-observability.py
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: 1.9.8
            - name: Report Terraform formatting differences
              run: |
                  terraform fmt -diff -recursive terraform/ > /tmp/terraform-fmt.diff || true
                  if [ -s /tmp/terraform-fmt.diff ]; then
                    {
                      echo "### Terraform formatting differences"
                      echo '```diff'
                      cat /tmp/terraform-fmt.diff
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Check Terraform formatting
              run: terraform fmt -check -recursive terraform/
            - name: Initialize Terraform providers
              run: terraform -chdir=terraform init -backend=false
            - name: Validate Terraform configuration
              run: terraform -chdir=terraform validate
            - name: Initialize and validate remote-state bootstrap configuration
              run: |
                  terraform -chdir=terraform/backend-bootstrap init -backend=false
                  terraform -chdir=terraform/backend-bootstrap validate
            - name: Validate Ansible playbook syntax
              run: |
                  python3 -m venv /tmp/ansible-venv
                  /tmp/ansible-venv/bin/pip install --disable-pip-version-check --no-input ansible-core==2.19.6
                  /tmp/ansible-venv/bin/ansible-playbook --syntax-check ansible/playbook.yml
            - name: Validate Kubernetes Manifests
              run: |
                  curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /tmp kubeconform # NOSONAR - CI-only, official release artifact, no runtime exposure
                  # Unknown custom-resource schemas (e.g. Argo Rollouts / ESO) are
                  # explicitly reported as skipped; built-in Kubernetes schemas
                  # remain strict and any validation error fails this job.
                  /tmp/kubeconform -strict -ignore-missing-schemas -summary \
                    kubernetes/application/ kubernetes/infra/ \
                    kubernetes/elastic-stack/ kubernetes/aws/ kubernetes/monitoring/
