name: Push Images & Update GitOps
on:
    workflow_call:

jobs:
    push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_HUB_USER }}
                  password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and Push Frontend
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile.prod
                  push: true
                  tags: an619/elastiflix-frontend:${{ github.sha }}

            - name: Build and Push Backend
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  file: ./backend/Dockerfile.prod
                  push: true
                  tags: an619/elastiflix-backend:${{ github.sha }}

            - name: Update K8s Manifests for GitOps
              run: |
                  sed -i "s|an619/elastiflix-frontend:.*|an619/elastiflix-frontend:${{ github.sha }}|g" kubernetes/application/frontend/deployment.yaml
                  sed -i "s|an619/elastiflix-backend:.*|an619/elastiflix-backend:${{ github.sha }}|g" kubernetes/application/backend/deployment.yaml

            - name: Commit and Push Changes
              run: |
                  git config --global user.name "GitHub Actions Bot"
                  git config --global user.email "actions@github.com"
                  git add kubernetes/
                  git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
                  git push
