name: Publish Docker Images
on:
    workflow_call:

# Publishing images does not need to write to the repository. GitOps manifest
# promotions must be made through a separately reviewed change.
permissions:
    contents: read
    id-token: write

concurrency:
    group: docker-push-${{ github.ref }}
    cancel-in-progress: false

jobs:
    push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Log in to Docker Hub
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
              with:
                  username: ${{ secrets.DOCKER_HUB_USER }}
                  password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and Push Frontend
              id: push-frontend
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile.prod
                  push: true
                  tags: an619/elastiflix-frontend:${{ github.sha }}
                  sbom: true
                  provenance: mode=max

            - name: Build and Push Backend
              id: push-backend
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ./backend
                  file: ./backend/Dockerfile.prod
                  push: true
                  tags: an619/elastiflix-backend:${{ github.sha }}
                  sbom: true
                  provenance: mode=max

            - name: Install Cosign
              uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
              with:
                  cosign-release: v3.1.5

            - name: Sign and verify images by digest
              env:
                  FRONTEND_DIGEST: ${{ steps.push-frontend.outputs.digest }}
                  BACKEND_DIGEST: ${{ steps.push-backend.outputs.digest }}
              run: |
                  frontend_ref="an619/elastiflix-frontend@${FRONTEND_DIGEST}"
                  backend_ref="an619/elastiflix-backend@${BACKEND_DIGEST}"

                  cosign sign --yes "$frontend_ref"
                  cosign sign --yes "$backend_ref"

                  signer='https://github.com/An619/Elastiflix/.github/workflows/docker-push.yml@refs/heads/main'
                  issuer='https://token.actions.githubusercontent.com'
                  cosign verify --certificate-identity "$signer" --certificate-oidc-issuer "$issuer" "$frontend_ref"
                  cosign verify --certificate-identity "$signer" --certificate-oidc-issuer "$issuer" "$backend_ref"

            - name: Report published image references
              run: |
                  {
                    echo "## Published container images"
                    echo "- Frontend tag: \`an619/elastiflix-frontend:${GITHUB_SHA}\`"
                    echo "- Frontend digest: \`an619/elastiflix-frontend@${{ steps.push-frontend.outputs.digest }}\`"
                    echo "- Backend tag: \`an619/elastiflix-backend:${GITHUB_SHA}\`"
                    echo "- Backend digest: \`an619/elastiflix-backend@${{ steps.push-backend.outputs.digest }}\`"
                    echo "- SBOM and provenance: attached to each published image by BuildKit (Syft SBOM generator)."
                    echo "- Cosign signatures: verified against the main-branch reusable workflow identity."
                    echo ""
                    echo "Promote digest-pinned references through a reviewed GitOps change."
                  } >> "$GITHUB_STEP_SUMMARY"
