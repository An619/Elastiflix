name: Publish Docker Images

on:
    workflow_call:
        secrets:
            DOCKER_HUB_USER:
                required: true
            DOCKER_HUB_PASSWORD:
                required: true

# Publishing is a read-only operation on the repository. The previous version
# committed a tag bump back to main with GITHUB_TOKEN, which both bypassed
# review and made the running image a side effect of CI. Promotion is now a
# reviewed GitOps change (ADR-0001, ADR-0002).
permissions:
    contents: read
    id-token: write

concurrency:
    group: docker-push-${{ github.ref }}
    cancel-in-progress: false

jobs:
    push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Log in to Docker Hub
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
              with:
                  username: ${{ secrets.DOCKER_HUB_USER }}
                  password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and push frontend
              id: push-frontend
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile.prod
                  push: true
                  tags: an619/elastiflix-frontend:${{ github.sha }}
                  # Supply-chain evidence attached to the published image.
                  sbom: true
                  provenance: mode=max

            - name: Build and push backend
              id: push-backend
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ./backend
                  file: ./backend/Dockerfile.prod
                  push: true
                  tags: an619/elastiflix-backend:${{ github.sha }}
                  sbom: true
                  provenance: mode=max

            - name: Install cosign
              uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
              with:
                  cosign-release: v3.1.5

            - name: Sign images and verify the signature
              env:
                  FRONTEND_DIGEST: ${{ steps.push-frontend.outputs.digest }}
                  BACKEND_DIGEST: ${{ steps.push-backend.outputs.digest }}
              run: |
                  set -euo pipefail
                  frontend_ref="an619/elastiflix-frontend@${FRONTEND_DIGEST}"
                  backend_ref="an619/elastiflix-backend@${BACKEND_DIGEST}"
                  cosign sign --yes "$frontend_ref"
                  cosign sign --yes "$backend_ref"
                  signer='https://github.com/An619/Elastiflix/.github/workflows/docker-push.yml@refs/heads/main'
                  issuer='https://token.actions.githubusercontent.com'
                  cosign verify --certificate-identity "$signer" --certificate-oidc-issuer "$issuer" "$frontend_ref"
                  cosign verify --certificate-identity "$signer" --certificate-oidc-issuer "$issuer" "$backend_ref"

            - name: Report published image digests
              env:
                  FRONTEND_DIGEST: ${{ steps.push-frontend.outputs.digest }}
                  BACKEND_DIGEST: ${{ steps.push-backend.outputs.digest }}
              run: |
                  {
                    echo "## Published container images"
                    echo ""
                    echo "Digest-pinned references to promote through a reviewed GitOps change:"
                    echo ""
                    echo "- \`an619/elastiflix-frontend:${GITHUB_SHA}\` → \`an619/elastiflix-frontend@${FRONTEND_DIGEST}\`"
                    echo "- \`an619/elastiflix-backend:${GITHUB_SHA}\` → \`an619/elastiflix-backend@${BACKEND_DIGEST}\`"
                    echo ""
                    echo "Both images carry an SBOM and max-mode provenance attestation and are signed with cosign."
                  } >> "$GITHUB_STEP_SUMMARY"
