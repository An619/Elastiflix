name: Docker and IaC Scans
on: workflow_call

jobs:
    trivy-filesystem-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Scan filesystem dependencies
              uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
              with:
                  version: v0.70.0
                  scan-type: fs
                  scan-ref: .
                  # The frontend lockfile has an exact, time-bound CRA build-toolchain
                  # policy check in dependency-scan.yml; npm audit covers its runtime tree.
                  skip-files: frontend/package-lock.json
                  scanners: vuln
                  format: table
                  exit-code: "1"
                  ignore-unfixed: true
                  severity: "CRITICAL,HIGH"

            - name: Report all HIGH/CRITICAL filesystem findings, including unfixed
              uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
              with:
                  version: v0.70.0
                  scan-type: fs
                  scan-ref: .
                  skip-files: frontend/package-lock.json
                  scanners: vuln
                  format: table
                  exit-code: "0" # Report-only companion; the preceding step is the blocking gate.
                  ignore-unfixed: false
                  severity: "CRITICAL,HIGH"

    trivy-image-scan:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service: [frontend, backend]
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Build ${{ matrix.service }} Image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ./${{ matrix.service }}
                  file: ./${{ matrix.service }}/Dockerfile.prod
                  push: false
                  load: true
                  tags: an619/elastiflix-${{ matrix.service }}:latest

            - name: Scan ${{ matrix.service }} Image
              uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
              with:
                  version: v0.70.0
                  image-ref: "an619/elastiflix-${{ matrix.service }}:latest"
                  format: "table"
                  exit-code: "1"
                  ignore-unfixed: true
                  severity: "CRITICAL,HIGH"

            - name: Report all HIGH/CRITICAL image findings, including unfixed
              uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
              with:
                  version: v0.70.0
                  image-ref: "an619/elastiflix-${{ matrix.service }}:latest"
                  format: table
                  exit-code: "0" # Report-only companion; the preceding step is the blocking gate.
                  ignore-unfixed: false
                  severity: "CRITICAL,HIGH"

    checkov-iac-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Setup Checkov
              run: |
                  python3 -m venv .venv
                  .venv/bin/pip install --quiet checkov==3.4.10
            # Terraform gate stays hard. CKV_TF_1 (module sources must be
            # commit-pinned) is skipped because the registry modules here
            # are already version-pinned, which is the registry convention
            # and cannot be expressed as a commit hash.
            - name: Checkov Terraform Scan
              run: .venv/bin/checkov -d terraform/ --framework terraform --quiet --compact --skip-check CKV_TF_1
            # Kubernetes scan remains report-only until the manifest-hardening
            # pass is complete. Preserve machine-readable results and summarize
            # remaining debt in the job summary for each run.
            - name: Checkov Kubernetes Scan (report-only)
              run: |
                  .venv/bin/checkov -d kubernetes/ --framework kubernetes --quiet --compact --soft-fail \
                    --output json --output-file-path /tmp/checkov-kubernetes
                  python3 - <<'PY'
                  import json
                  import os
                  from collections import Counter
                  from pathlib import Path

                  report = json.loads(Path("/tmp/checkov-kubernetes/results_json.json").read_text())
                  results = report.get("results", {})
                  failed = results.get("failed_checks", [])
                  passed = results.get("passed_checks", [])
                  skipped = results.get("skipped_checks", [])
                  counts = report.get("summary", {})
                  by_check = Counter((item.get("check_id", "unknown"), item.get("check_name", "")) for item in failed)
                  summary = [
                      "### Kubernetes Checkov baseline (report-only)",
                      f"Passed: {counts.get('passed', len(passed))} · Failed: {counts.get('failed', len(failed))} · Skipped: {counts.get('skipped', len(skipped))}",
                      "",
                      "| Check | Findings | Policy |",
                      "| --- | ---: | --- |",
                  ]
                  summary.extend(
                      f"| `{check_id}` | {count} | {name} |"
                      for (check_id, name), count in sorted(by_check.items())
                  )
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
                      output.write("\n".join(summary) + "\n")
                  PY
