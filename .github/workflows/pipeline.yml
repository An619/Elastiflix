name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build Frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Test Backend
        run: |
          cd backend
          npm ci
          npm test --if-present

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for Gitleaks to scan full git history

      # 1. Secret Scanning
      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. IaC Scanning (Terraform)
      - name: Run Checkov (Terraform Scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: true # Set to false if you want the pipeline to fail on IaC errors

      # 3. Code & Image Scanning (Trivy)
      - name: Run Trivy filesystem vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "0"

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          load: true
          tags: an619/elastiflix-frontend:latest

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "an619/elastiflix-frontend:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Frontend Image
        run: docker push an619/elastiflix-frontend:latest

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: an619/elastiflix-backend:latest

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "an619/elastiflix-backend:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Backend Image
        run: docker push an619/elastiflix-backend:latest
