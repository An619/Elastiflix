name: SonarCloud SAST
on:
    workflow_call:
        secrets:
            SONAR_TOKEN:
                required: true

jobs:
    sonar:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: |
                      frontend/package-lock.json
                      backend/package-lock.json
            - name: Generate Frontend Coverage
              run: |
                  cd frontend
                  npm ci --legacy-peer-deps # NOSONAR - standard dependency CI step, reproducible install from lockfile
                  CI=true npm test -- --watchAll=false --coverage --collectCoverageFrom="src/**/*.{js,jsx}"
            - name: Generate Backend Coverage
              run: |
                  cd backend
                  npm ci # NOSONAR - standard dependency CI step, reproducible install from lockfile
                  npm run test:coverage
            - name: Generate npm audit policy coverage
              run: |
                  backend/node_modules/.bin/c8 \
                    --reporter=lcov \
                    --report-dir=policy-coverage \
                    --include=scripts/npm-audit-policy.js \
                    node --test scripts/test/npm-audit-policy.test.js
            - name: Generate Python Coverage
              run: |
                  cd data-loader
                  python3 -m pip install --upgrade pip # NOSONAR - CI-only tooling
                  pip install coverage # NOSONAR - CI-only tooling
                  coverage run --include="index-data.py" test_index_data.py
                  coverage xml -o coverage-python.xml
            - name: SonarCloud Scan
              uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
