stages:
  - build
  - security
  - package

variables:
  DOCKER_DRIVER: overlay2
  # Use GitLab's built-in registry variables
  IMAGE_FRONTEND: $CI_REGISTRY_IMAGE/frontend
  IMAGE_BACKEND: $CI_REGISTRY_IMAGE/backend

# ----------------------------------------
# Stage 1: Build & Test
# ----------------------------------------
build_frontend:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - CI=true npm test -- --watchAll=false
    - npm run build
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 hour

build_backend:
  stage: build
  image: node:22-alpine
  script:
    - cd backend
    - npm ci
    - npm test

# ----------------------------------------
# Stage 2: Security Scanning (DevSecOps)
# ----------------------------------------
npm_audit:
  stage: security
  image: node:22-alpine
  script:
    - node --test scripts/test/npm-audit-policy.test.js
    - npm exec -- node scripts/npm-audit-policy.js frontend
    - npm exec -- node scripts/npm-audit-policy.js backend
    - npm audit --omit=dev --audit-level=high --prefix frontend
    - npm audit --audit-level=high --prefix backend

pip_audit:
  stage: security
  image: python:3.11-slim
  script:
    - python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: pip-audit==2.10.1
    - pip-audit -r data-loader/pip-requirements.txt

trivy_scan:
  stage: security
  image:
    name: aquasec/trivy:0.70.0
    entrypoint: [""]
  script:
    # npm audit plus the exact exception policy cover the frontend lockfile.
    - trivy fs --skip-files frontend/package-lock.json --exit-code 0 --severity HIGH,CRITICAL --no-progress .
    - trivy fs --skip-files frontend/package-lock.json --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress .

# ----------------------------------------
# Stage 3: Package (Docker Build & Push)
# ----------------------------------------
package_images:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Logging into GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

    - echo "Building Frontend Image..."
    - docker build -f frontend/Dockerfile.prod -t $IMAGE_FRONTEND:$CI_COMMIT_SHORT_SHA -t $IMAGE_FRONTEND:latest ./frontend
    - docker push $IMAGE_FRONTEND:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_FRONTEND:latest

    - echo "Building Backend Image..."
    - docker build -f backend/Dockerfile.prod -t $IMAGE_BACKEND:$CI_COMMIT_SHORT_SHA -t $IMAGE_BACKEND:latest ./backend
    - docker push $IMAGE_BACKEND:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_BACKEND:latest
