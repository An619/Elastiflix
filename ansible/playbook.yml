---
- name: Bootstrap EKS cluster add-ons
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    eks_cluster_name: "{{ lookup('env', 'EKS_CLUSTER_NAME') }}"
    alb_controller_role_arn: "{{ lookup('env', 'ALB_CONTROLLER_ROLE_ARN') }}"
    eso_role_arn: "{{ lookup('env', 'ESO_ROLE_ARN') }}"
  tasks:
    - name: Require Terraform outputs for this cluster
      ansible.builtin.assert:
        that:
          - eks_cluster_name | length > 0
          - alb_controller_role_arn is match('^arn:[^:]+:iam::[0-9]{12}:role/.+')
          - eso_role_arn is match('^arn:[^:]+:iam::[0-9]{12}:role/.+')
        fail_msg: >-
          Export EKS_CLUSTER_NAME, ALB_CONTROLLER_ROLE_ARN, and ESO_ROLE_ARN from
          the selected Terraform environment before running this playbook.

    - name: Apply namespaces and Pod Security Admission labels before workloads
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - kubernetes/namespaces/namespaces.yaml

    - name: Create the External Secrets Operator namespace
      ansible.builtin.command:
        argv:
          - kubectl
          - create
          - namespace
          - external-secrets
          - --dry-run=client
          - -o
          - yaml
      register: external_secrets_namespace
      changed_when: false

    - name: Ensure the External Secrets Operator namespace exists
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - -
        stdin: "{{ external_secrets_namespace.stdout }}"
      register: external_secrets_namespace_apply
      changed_when: "'unchanged' not in external_secrets_namespace_apply.stdout"

    - name: Create the External Secrets Operator service account
      ansible.builtin.command:
        argv:
          - kubectl
          - create
          - serviceaccount
          - external-secrets
          - --namespace
          - external-secrets
          - --dry-run=client
          - -o
          - yaml
      register: external_secrets_service_account
      changed_when: false

    - name: Apply the External Secrets Operator service account
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - -
        stdin: "{{ external_secrets_service_account.stdout }}"
      register: external_secrets_service_account_apply
      changed_when: "'unchanged' not in external_secrets_service_account_apply.stdout"

    - name: Annotate the External Secrets Operator service account with its Terraform IRSA role
      ansible.builtin.command:
        argv:
          - kubectl
          - annotate
          - serviceaccount
          - external-secrets
          - --namespace
          - external-secrets
          - "eks.amazonaws.com/role-arn={{ eso_role_arn }}"
          - --overwrite

    - name: Add Helm repositories
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ item.name }}"
          - "{{ item.url }}"
          - --force-update
      loop:
        - name: argo
          url: https://argoproj.github.io/argo-helm
        - name: external-secrets
          url: https://charts.external-secrets.io
        - name: eks
          url: https://aws.github.io/eks-charts

    - name: Install Argo CD
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - argocd
          - argo/argo-cd
          - --version
          - 10.20.0
          - --namespace
          - argocd
          - --create-namespace

    - name: Wait for Argo CD to become ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=available
          - --timeout=300s
          - deployment/argocd-server
          - --namespace
          - argocd

    - name: Create the Argo Rollouts namespace
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash

    - name: Install the pinned Argo Rollouts controller and CRDs
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --server-side
          - --force-conflicts
          - --namespace
          - argo-rollouts
          - -f
          - https://raw.githubusercontent.com/argoproj/argo-rollouts/v1.10.2/manifests/install.yaml

    - name: Wait for Argo Rollouts controller to become ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=available
          - --timeout=300s
          - deployment/argo-rollouts
          - --namespace
          - argo-rollouts

    - name: Install External Secrets Operator
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - external-secrets
          - external-secrets/external-secrets
          - --version
          - 2.15.0
          - --namespace
          - external-secrets
          - --create-namespace
          - --set
          - serviceAccount.create=false
          - --set
          - serviceAccount.name=external-secrets

    - name: Wait for External Secrets Operator to become ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=available
          - --timeout=300s
          - deployment/external-secrets
          - --namespace
          - external-secrets

    - name: Create AWS Load Balancer Controller service account
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create serviceaccount aws-load-balancer-controller \
          --namespace kube-system --dry-run=client -o yaml |
          kubectl apply -f -
      args:
        executable: /bin/bash

    - name: Annotate the controller service account with its Terraform IRSA role
      ansible.builtin.command:
        argv:
          - kubectl
          - annotate
          - serviceaccount
          - aws-load-balancer-controller
          - --namespace
          - kube-system
          - "eks.amazonaws.com/role-arn={{ alb_controller_role_arn }}"
          - --overwrite

    - name: Install AWS Load Balancer Controller
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - aws-load-balancer-controller
          - eks/aws-load-balancer-controller
          - --version
          - 3.7.0
          - --namespace
          - kube-system
          - --set
          - "clusterName={{ eks_cluster_name }}"
          - --set
          - serviceAccount.create=false
          - --set
          - serviceAccount.name=aws-load-balancer-controller

    - name: Register GitOps Applications after cluster prerequisites are ready
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - kubernetes/argocd-app.yaml
          - -f
          - kubernetes/argocd-infra.yaml
          - -f
          - kubernetes/argocd-elk.yaml
          - -f
          - kubernetes/argocd-monitoring.yaml
          - -f
          - kubernetes/argocd-monitoring-network-policy.yaml
          - -f
          - kubernetes/argocd-aws-secrets.yaml
