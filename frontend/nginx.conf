server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Kubernetes Services resolve through the pod's configured DNS; Nginx
        # resolves the backend Service name when it starts.
        proxy_pass http://backend:17700/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
