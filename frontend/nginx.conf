server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # No `resolver` directive on purpose. The previous version pinned
        # 127.0.0.11 -- Docker's embedded DNS -- which does not exist in
        # Kubernetes, so nginx answered 502 on every /api request there.
        # Without `resolver`, nginx resolves `backend` once at startup using
        # the pod's own /etc/resolv.conf, which is correct in both Docker
        # Compose and Kubernetes. A Service ClusterIP is stable for the life
        # of the Service, so a pod restart does not invalidate it.
        # Adds `/api/` and the remaining request URI, e.g. POST /api/search
        # is proxied to http://backend:17700/api/search.
        proxy_pass http://backend:17700/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
