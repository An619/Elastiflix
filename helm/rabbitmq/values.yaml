image:
  repository: rabbitmq
  tag: 4.1-management

auth:
  username: user
  # Do NOT commit real passwords. Override at install time:
  #   helm install rabbitmq ./helm/rabbitmq --set auth.password="$RABBITMQ_PASSWORD"
  # Rotate any password previously committed here.
  password: ""

persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
