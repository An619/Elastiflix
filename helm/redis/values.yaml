global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/redis
  tag: 7.2.4-debian-12-r5

architecture: standalone
auth:
  enabled: true
  # Do NOT commit real passwords. Override at install time:
  #   helm install redis ./helm/redis --set auth.password="$REDIS_PASSWORD"
  # or use existingSecret. Rotate any password previously committed here.
  password: ""

master:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m

  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10
commonConfiguration: |
  loadmodule ""
