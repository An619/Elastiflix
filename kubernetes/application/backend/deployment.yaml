apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: elastiflix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: an619/elastiflix-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 17700
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: backend-secret # To be created in AWS via ESO
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: 17700
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 17700
            initialDelaySeconds: 20
            periodSeconds: 10
