apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: elastiflix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: an619/elastiflix-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 17700
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: backend-secret
                optional: true
          # Passwords come from the Secret; Backend.js builds REDIS_URL /
          # RABBITMQ_URL from REDIS_PASSWORD / RABBITMQ_PASSWORD when the
          # full URLs are not set explicitly.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: redis-password
                  optional: true
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: rabbitmq-password
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 17700
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 17700
            initialDelaySeconds: 20
            periodSeconds: 10
