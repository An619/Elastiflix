apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: elastiflix
  annotations:
    checkov.io/skip: "CKV_K8S_35=Temporary image-contract compatibility: this pinned image predates Secret-file support; owner @An619, expire 2027-02-22, track in docs/security/phase-2-kubernetes-hardening.md and remove after rebuilding and promoting the backend image."
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: an619/elastiflix-backend:09fe45ac8fabf3242b95f88a79c651bd161b4e29@sha256:06835ad91515135b867e0b180b2f67ac3ba018765790be867c33dfeb4faf0b74
          imagePullPolicy: Always
          ports:
            - containerPort: 17700
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: backend-secret
                optional: true
          # Retain the existing image contract until the phase 2 backend image
          # with Secret-file support is built and promoted by its digest.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: redis-password
                  optional: true
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: rabbitmq-password
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 17700
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 17700
            initialDelaySeconds: 20
            periodSeconds: 10
