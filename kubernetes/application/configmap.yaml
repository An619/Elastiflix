apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: elastiflix
data:
  LOCAL: "true"
  NODE_ENV: "production"
  PUBLIC_HOST: "localhost"
  ES_HOST: "http://elasticsearch.elastic-stack.svc.cluster.local:9200"
  ES_INDEX: "elastiflix-movies"
  ES_API_KEY: ""
  REDIS_URL: "redis://:elastiflix-redis-pass@redis.infra.svc.cluster.local:6379"
  RABBITMQ_URL: "amqp://user:elastiflix-rabbit-pass@rabbitmq.infra.svc.cluster.local:5672"
