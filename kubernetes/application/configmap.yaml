apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: elastiflix
data:
  LOCAL: "true"
  NODE_ENV: "production"
  PUBLIC_HOST: "elastiflix.local"
  ES_HOST: "http://elasticsearch.elastic-stack.svc.cluster.local:9200"
  ES_INDEX: "elastiflix-movies"
  ES_API_KEY: ""
  # REDIS_URL / RABBITMQ_URL are injected from the backend-secret Secret
  # (see backend/deployment.yaml env). Do NOT put passwords here —
  # ConfigMaps are plaintext in etcd and in Git.
  REDIS_HOST: "redis.infra.svc.cluster.local"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq.infra.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "user"
