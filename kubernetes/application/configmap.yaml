apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: elastiflix
data:
  LOCAL: "true"
  NODE_ENV: "production"
  PUBLIC_HOST: "elastiflix.local"
  ES_HOST: "https://elasticsearch.elastic-stack.svc.cluster.local:9200"
  ES_INDEX: "elastiflix-movies"
  # Redis/RabbitMQ credentials are mounted from backend-secret by the
  # backend Deployment. Do NOT put passwords here — ConfigMaps are plaintext
  # in etcd and in Git.
  REDIS_HOST: "redis.infra.svc.cluster.local"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq.infra.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "user"
