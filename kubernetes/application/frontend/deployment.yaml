apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: elastiflix
spec:
  replicas: 2
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30s } # Wait 30 seconds before full rollout
        - setWeight: 100
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: an619/elastiflix-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
