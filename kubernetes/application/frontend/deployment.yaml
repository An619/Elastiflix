apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: elastiflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: an619/elastiflix-frontend:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
