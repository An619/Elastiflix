apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: elastiflix
spec:
  replicas: 2
  progressDeadlineSeconds: 600
  # Canary steps 10% -> 25% -> 50% -> 100%. A failed AnalysisRun aborts the
  # rollout and returns all traffic to the stable Service, which is the rollback
  # mechanism that replaces the previous unconditional "pause 30s then 100%".
  strategy:
    canary:
      stableService: frontend
      canaryService: frontend-canary
      # No `trafficRouting` block on purpose. Weight-based routing through
      # ingress-nginx or the ALB requires an additional controller plugin and a
      # verified ingress setup. Without it Argo Rollouts performs a basic canary
      # (it scales the stable and canary ReplicaSets to approximate the weight),
      # which is honest about what this repository can verify. See
      # docs/security/phase-4-gitops-progressive-delivery.md.
      maxSurge: 1
      maxUnavailable: 0
      scaleDownDelaySeconds: 30
      abortScaleDownDelaySeconds: 30
      steps:
        - setWeight: 10
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: frontend-canary-health
        - setWeight: 25
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: frontend-canary-health
        - setWeight: 50
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: frontend-canary-health
        - setWeight: 100
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      serviceAccountName: frontend
      securityContext:
        runAsNonRoot: true
        # nginxinc/nginx-unprivileged runs as uid/gid 101.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Pinned to the git commit SHA (ADR-0002); see the backend manifest
          # for the digest-pinning limitation.
          image: an619/elastiflix-frontend:30703b0142e155085ba428b208d97fe54c089562
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              # nginx writes proxy buffers and caches to the two emptyDirs below.
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx needs writable cache and temp paths on a read-only rootfs.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: elastiflix
automountServiceAccountToken: false
