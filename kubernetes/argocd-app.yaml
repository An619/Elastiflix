apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastiflix
  namespace: argocd
  finalizers:
    # Deleting this Application must delete the resources it owns, otherwise the
    # next sync leaves orphans behind and prune silently stops working.
    - resources-finalizer.argocd.argoproj.io
spec:
  # Scoped to the project defined in kubernetes/argocd-project.yaml; `default`
  # would allow any repository and any cluster destination.
  project: elastiflix
  source:
    repoURL: "https://github.com/An619/Elastiflix.git"
    # Pinned to a branch name rather than HEAD: `HEAD` follows whatever the
    # remote default becomes and cannot be reviewed as a change.
    targetRevision: main
    path: kubernetes/application
    # The workloads live in backend/ and frontend/ subdirectories plus rbac/.
    # Without recurse Argo CD applies only the top-level files and silently
    # deploys none of them.
    directory:
      recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: elastiflix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
