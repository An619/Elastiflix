apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-ingress
  namespace: argocd
spec:
  project: elastiflix
  source:
    repoURL: "https://github.com/An619/Elastiflix.git"
    targetRevision: main
    path: kubernetes/aws
    directory:
      recurse: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: elastiflix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
