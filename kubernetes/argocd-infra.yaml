apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-databases
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/An619/Elastiflix.git"
    targetRevision: HEAD
    path: kubernetes
    directory:
      include: "infra.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
