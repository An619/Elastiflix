apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastiflix-local-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/An619/Elastiflix.git
    targetRevision: main
    path: kubernetes/gitops/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
