# Namespaces and their Pod Security Admission labels.
#
# CreateNamespace=true on the workload Applications would create bare
# namespaces; the namespaces here carry the PSA labels that make Phase 3
# enforcement real, so they are applied by their own Application, first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: elastiflix
  source:
    repoURL: "https://github.com/An619/Elastiflix.git"
    targetRevision: main
    path: kubernetes/namespaces
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # Namespaces are cluster-scoped; pruning them would delete every workload
      # in them, so prune is disabled for this Application.
      - CreateNamespace=false
