apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: elastiflix
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Fail closed: no HTTP listener is created. Before syncing this Ingress,
    # supply the approved ACM certificate ARN and DNS hostname for the service.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /
    # Argo Rollouts updates this action to add the canary target group and
    # weighted traffic split during a rollout. Keep the initial route stable.
    alb.ingress.kubernetes.io/actions.frontend: |
      {"Type":"forward","ForwardConfig":{"TargetGroups":[{"ServiceName":"frontend","ServicePort":"80","Weight":100}]}}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # /api MUST come before / — ALB evaluates rules in order and
          # Prefix "/" would otherwise match every request, shadowing /api.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 17700
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: use-annotation
