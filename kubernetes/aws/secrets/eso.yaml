---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: elastiflix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: backend-secret
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: elastiflix/redis
        property: redis-password
    - secretKey: rabbitmq-password
      remoteRef:
        key: elastiflix/rabbitmq
        property: rabbitmq-password
    - secretKey: es-api-key
      remoteRef:
        key: elastiflix/elasticsearch
        property: backend-api-key
    - secretKey: es-ca.crt
      remoteRef:
        key: elastiflix/elasticsearch-tls
        property: ca_crt
