apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: elastic-stack
  annotations:
    checkov.io/skip1: CKV_K8S_43=upstream image is pinned to a reviewed release tag; digest pinning needs registry access from CI
    checkov.io/skip2: CKV_K8S_15=static reviewed release tag; floating tags are not used
    checkov.io/skip3: CKV_K8S_40=upstream image hard-codes uid 1000 for its runtime user
    # This workload writes an optimised bundle, logs, or generated config into
    # its home directory at start-up, so a read-only root filesystem prevents it
    # from booting. Restricted Pod Security does not require one.
    checkov.io/skip4: CKV_K8S_22=upstream image writes to its home directory at start-up
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The official Elastic image runs as the `elasticsearch` user (1000).
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Elasticsearch needs more than the default 30s to open its data path on
      # a cold PVC; a startup probe keeps the liveness probe from restarting it
      # while it boots.
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            # Security is disabled for this single-node demo deployment. This is
            # an accepted, documented risk, not a production configuration: see
            # docs/security/phase-3-kubernetes-security-reliability.md.
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            # Elasticsearch writes logs and generated config next to its home
            # directory, so a read-only root filesystem would prevent start-up.
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - curl -fsS http://localhost:9200/_cluster/health >/dev/null
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  curl -fsS http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - curl -fsS http://localhost:9200/_cluster/health >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elastic-stack
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      name: http
      targetPort: http
