apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: elastic-stack
  annotations:
    checkov.io/skip: CKV_K8S_35=Elastic entrypoint requires ELASTIC_PASSWORD env; sourced only from a namespaced SecretKeyRef, not plaintext. Revisit with a supported file/keystore flow before production.
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-writable-config
          image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0@sha256:47f91984aa1065d745f0a7c827bc912ea1ac439c635854902b65b6ed77f62055
          command:
            - /bin/sh
            - -c
            - cp -R /usr/share/elasticsearch/config/. /config/ && chmod -R u+rwX /config
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: elasticsearch-config
              mountPath: /config
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0@sha256:47f91984aa1065d745f0a7c827bc912ea1ac439c635854902b65b6ed77f62055
          imagePullPolicy: Always
          ports:
            - containerPort: 9200
              name: https
            - containerPort: 9300
              name: transport
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-bootstrap
                  key: elastic-password
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.transport.ssl.enabled
              value: "true"
            - name: xpack.security.transport.ssl.verification_mode
              value: certificate
            - name: xpack.security.transport.ssl.key
              value: /usr/share/elasticsearch/config/certs/tls.key
            - name: xpack.security.transport.ssl.certificate
              value: /usr/share/elasticsearch/config/certs/tls.crt
            - name: xpack.security.transport.ssl.certificate_authorities
              value: /usr/share/elasticsearch/config/certs/ca.crt
            - name: xpack.security.http.ssl.enabled
              value: "true"
            - name: xpack.security.http.ssl.key
              value: /usr/share/elasticsearch/config/certs/tls.key
            - name: xpack.security.http.ssl.certificate
              value: /usr/share/elasticsearch/config/certs/tls.crt
            - name: xpack.security.http.ssl.certificate_authorities
              value: /usr/share/elasticsearch/config/certs/ca.crt
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  curl --fail --silent --show-error --cacert /usr/share/elasticsearch/config/certs/ca.crt \
                    --user "elastic:$(cat /run/secrets/elasticsearch/elastic-password)" \
                    https://localhost:9200/ >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  curl --fail --silent --cacert /usr/share/elasticsearch/config/certs/ca.crt \
                    --user "elastic:$(cat /run/secrets/elasticsearch/elastic-password)" \
                    https://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: elasticsearch-config
              mountPath: /usr/share/elasticsearch/config
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: elasticsearch-logs
              mountPath: /usr/share/elasticsearch/logs
            - name: elasticsearch-tmp
              mountPath: /tmp
            - name: elasticsearch-tls
              mountPath: /usr/share/elasticsearch/config/certs
              readOnly: true
            - name: elasticsearch-bootstrap
              mountPath: /run/secrets/elasticsearch
              readOnly: true
      volumes:
        - name: elasticsearch-config
          emptyDir: {}
        - name: elasticsearch-logs
          emptyDir: {}
        - name: elasticsearch-tmp
          emptyDir: {}
        - name: elasticsearch-tls
          secret:
            secretName: elasticsearch-tls
        - name: elasticsearch-bootstrap
          secret:
            secretName: elasticsearch-bootstrap
            items:
              - key: elastic-password
                path: elastic-password
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elastic-stack
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      name: https
      targetPort: 9200
