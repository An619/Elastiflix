apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: elastic-stack
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: elastic-stack
data:
  filebeat.yml: |-
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*.log
      processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
            - logs_path:
                logs_path: "/var/log/containers/"

    output.logstash:
      hosts: ["logstash:5044"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: elastic-stack
  labels:
    app: filebeat
  annotations:
    # Filebeat is a node-log collector, so several checks are structurally
    # inapplicable. Each exception is scoped to this one workload; the
    # elastic-stack namespace is audit+warn rather than enforce for this reason.
    checkov.io/skip1: CKV_K8S_43=upstream image pinned to a reviewed release tag; digest pinning needs registry access
    checkov.io/skip2: CKV_K8S_15=static reviewed release tag
    checkov.io/skip3: CKV_K8S_23=node log files under /var/log are root-owned; a non-root collector cannot read them
    checkov.io/skip4: CKV_K8S_40=root is required for the same reason as CKV_K8S_23
    checkov.io/skip5: CKV_K8S_22=filebeat persists its registry under /usr/share/filebeat/data on the node filesystem
    checkov.io/skip6: CKV_K8S_38=add_kubernetes_metadata requires the projected service-account token and its ClusterRole
    checkov.io/skip7: CKV_K8S_25=DAC_READ_SEARCH is the minimum capability needed to read root-owned log files with all others dropped
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      # Filebeat must read node log files owned by root, so this pod cannot meet
      # the restricted Pod Security Standard. The elastic-stack namespace is
      # therefore audit+warn only; every other Elastic workload is hardened.
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:9.1.0
          args: ["-c", "/etc/filebeat.yml", "-e"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              # Everything is dropped; the single re-added capability is the
              # narrow read-bypass needed for root-owned log files. It is a
              # documented, reviewed exception, not a default.
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"] # NOSONAR - required to read node logs; all other capabilities dropped, pod runs as a dedicated SA without API verbs beyond get/list/watch
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 200Mi
          # `filebeat test output` exits non-zero when the configured Logstash
          # output is unreachable, which is the health signal that matters for
          # this collector.
          readinessProbe:
            exec:
              command: ["filebeat", "test", "output", "-c", "/etc/filebeat.yml"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["filebeat", "test", "output", "-c", "/etc/filebeat.yml"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              readOnly: true
              subPath: filebeat.yml
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            defaultMode: 0640
            name: filebeat-config
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: varlog
          hostPath:
            path: /var/log
