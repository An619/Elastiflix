apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: elastic-stack
  annotations:
    checkov.io/skip1: CKV_K8S_43=upstream image is pinned to a reviewed release tag; digest pinning needs registry access from CI
    checkov.io/skip2: CKV_K8S_15=static reviewed release tag; floating tags are not used
    checkov.io/skip3: CKV_K8S_40=upstream image hard-codes uid 1000 for its runtime user
    # This workload writes an optimised bundle, logs, or generated config into
    # its home directory at start-up, so a read-only root filesystem prevents it
    # from booting. Restricted Pod Security does not require one.
    checkov.io/skip4: CKV_K8S_22=upstream image writes to its home directory at start-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Official Kibana image runs as uid/gid 1000.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.1.0
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            - name: XPACK_SECURITY_ENABLED
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            # Kibana writes an optimised bundle and logs under its home
            # directory at start-up.
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: elastic-stack
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: http
