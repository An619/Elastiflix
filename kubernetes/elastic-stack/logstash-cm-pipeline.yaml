apiVersion: v1
data:
  logs.conf: "# ---------------------------------------------------------------------------\n# Elastiflix application logs:  Filebeat -> Logstash -> Elasticsearch\n#\n# Filebeat tails the container stdout and ships raw lines here. Logstash is\n# what turns \"a line of text\" into \"a document you can aggregate on\".\n# ---------------------------------------------------------------------------\n\ninput {\n  beats {\n    port => 5044\n  }\n}\n\nfilter {\n\n  # Our backend emits one JSON object per line. Parse it into real fields.\n  # Anything that isn't JSON (npm noise, nodemon banners) just stays as\n  # `message` and gets tagged, rather than blowing up the pipeline.\n  if [message] =~ /^\\s*\\{/ {\n    json {\n      source        => \"message\"\n      target        => \"app\"\n      skip_on_invalid_json => true\n      add_tag       => [ \"json_parsed\" ]\n    }\n  }\n\n  # Promote the fields we want to chart to the top level.\n  if [app] {\n    mutate {\n      rename => {\n        \"[app][method]\"      => \"http_method\"\n        \"[app][path]\"        => \"http_path\"\n        \"[app][status]\"      => \"http_status\"\n        \"[app][duration_ms]\" => \"duration_ms\"\n        \"[app][query]\"       => \"search_query\"\n        \"[app][results]\"     => \"result_count\"\n        \"[app][level]\"       => \"log_level\"\n        \"[app][search_type]\" => \"search_type\"\n        \"[app][service]\"     => \"service\"\n      }\n    }\n\n    # Use the time the backend wrote the line, not the time Filebeat happened\n    # to read it. Without this every document is stamped seconds late and the\n    # latency panels lie.\n    date {\n      match  => [ \"[app][@timestamp]\", \"ISO8601\" ]\n      target => \"@timestamp\"\n    }\n    mutate {\n      convert => {\n        \"http_status\"  => \"integer\"\n        \"duration_ms\"  => \"float\"\n        \"result_count\" => \"integer\"\n      }\n    }\n  }\n\n  # A search that returned nothing is a product signal worth being able to find.\n  if [result_count] == 0 and [search_query] {\n    mutate { add_tag => [ \"zero_results\" ] }\n  }\n\n  # Slow requests, flagged at ingest so the dashboard doesn't have to compute it.\n  if [duration_ms] and [duration_ms] > 500 {\n    mutate { add_tag => [ \"slow_request\" ] }\n  }\n\n  # Drop everything that isn't worth a mapped field. Filebeat is generous:\n  # a single log line arrives carrying the container's full Docker label set\n  # (including absolute host paths), the raw line twice over, and inode-level\n  # file bookkeeping. Left alone that is 97 mapped fields for ~20 useful ones,\n  # and Discover becomes unreadable on camera.\n  #\n  # `app` goes last -- by now every field worth charting has been promoted\n  # out of it by the rename above.\n  mutate {\n    remove_field => [\n      \"@version\", \"agent\", \"ecs\", \"input\", \"app\",\n      \"docker\",             # duplicate of [container], plus every compose label\n      \"event\",              # event.original is byte-for-byte [message]\n      \"[container][labels]\",\n      \"[container][image]\",\n      \"[log][file][device_id]\", \"[log][file][inode]\", \"[log][file][fingerprint]\",\n      \"[log][offset]\",\n      \"[host][name]\"        # the container ID, already in [container][name]\n    ]\n  }\n}\n\noutput {\n  elasticsearch {\n    hosts       => [ \"${ES_HOST}\" ]\n    ssl_enabled => true\n    ssl_certificate_authorities => [\"/run/secrets/elastic/ca.crt\"]\n    api_key     => \"${ES_API_KEY}\"\n    index       => \"elastiflix-logs-%{+YYYY.MM.dd}\"\n\n    # Same trick as movies.conf, and here it matters even more: search_query\n    # MUST be a keyword. Let dynamic mapping make it `text` and the \"top search\n    # terms\" panel becomes impossible -- you get \"Fielddata is disabled\".\n    manage_template    => true\n    template           => \"/usr/share/logstash/templates/logs-template.json\"\n    template_name      => \"elastiflix-logs\"\n    template_overwrite => true\n  }\n}\n"
  movies.conf: "# ---------------------------------------------------------------------------\n# Elastiflix movie catalog loader\n#\n# This replaces data-loader/index-data.py with a declarative Logstash pipeline.\n# Same source file, same target index, same result -- but every stage of the\n# ETL is visible instead of buried in Python.\n#\n#   input  -> where the data comes from\n#   filter -> how we clean, convert and ENRICH it\n#   output -> where it lands\n# ---------------------------------------------------------------------------\n\ninput {\n  file {\n    path            => \"/data/movies.ndjson\"\n    start_position  => \"beginning\"\n    sincedb_path    => \"/dev/null\"   # always re-read: we want a repeatable demo\n    codec           => json          # one JSON movie per line\n    mode            => \"read\"\n    file_completed_action => \"log\"\n    file_completed_log_path => \"/tmp/movies-done.log\"\n  }\n}\n\nfilter {\n\n  # --- 1. Drop the plumbing Logstash adds but Elasticsearch doesn't need -----\n  mutate {\n    remove_field => [ \"@version\", \"event\", \"log\", \"host\", \"path\" ]\n  }\n\n  # --- 2. Type coercion -----------------------------------------------------\n  # The source data has `id` as an integer, but the mapping wants a keyword.\n  mutate {\n    convert => { \"id\" => \"string\" }\n  }\n\n  # --- 3. ENRICHMENT: derive the field the app needs but the data lacks ------\n  # The Elastiflix UI renders a \"user_score\" range facet, but not one of the\n  # 6,959 source documents actually contains that field -- so the facet is\n  # always empty. TMDB's vote_average is the same 0-10 scale, so we derive it\n  # here. This is the thing Logstash gives you that a dumb bulk load does not.\n  if [vote_average] {\n    ruby {\n      code => \"event.set('user_score', event.get('vote_average').to_f)\"\n    }\n  }\n\n  # --- 4. Dates -------------------------------------------------------------\n  # Some records have an empty release_date. Remove it rather than let it fail\n  # the mapping, then use the real ones to drive @timestamp so Kibana can plot\n  # the catalog over time.\n  if [release_date] == \"\" {\n    mutate { remove_field => [ \"release_date\" ] }\n  } else {\n    date {\n      match  => [ \"release_date\", \"yyyy-MM-dd\" ]\n      target => \"@timestamp\"\n      tag_on_failure => [ \"_dateparsefailure\" ]\n    }\n  }\n\n  # --- 5. Quality gate ------------------------------------------------------\n  # A movie with no title is useless to a search app.\n  if ![title] or [title] == \"\" {\n    drop { }\n  }\n}\n\noutput {\n  elasticsearch {\n    hosts       => [ \"${ES_HOST}\" ]\n    ssl_enabled => true\n    ssl_certificate_authorities => [\"/run/secrets/elastic/ca.crt\"]\n    api_key     => \"${ES_API_KEY}\"\n    index       => \"elastiflix-movies\"\n    document_id => \"%{id}\"          # re-running updates instead of duplicating\n    action      => \"index\"\n\n    # Logstash installs the index template ITSELF, at startup, before a single\n    # document is sent. That ordering is the whole point: without a mapping in\n    # place first, Elasticsearch guesses -- release_date becomes a string and\n    # genres becomes unaggregatable, and you cannot fix either without a reindex.\n    manage_template    => true\n    template           => \"/usr/share/logstash/templates/movies-template.json\"\n    template_name      => \"elastiflix-movies\"\n    template_overwrite => true\n  }\n\n  # Uncomment on camera to watch documents flow through the pipeline live.\n  # stdout { codec => rubydebug }\n}\n"
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: elastic-stack
