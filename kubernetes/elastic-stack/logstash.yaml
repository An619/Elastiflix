apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: elastic-stack
  annotations:
    checkov.io/skip1: CKV_K8S_43=upstream image is pinned to a reviewed release tag; digest pinning needs registry access from CI
    checkov.io/skip2: CKV_K8S_15=static reviewed release tag; floating tags are not used
    checkov.io/skip3: CKV_K8S_40=upstream image hard-codes uid 1000 for its runtime user
    # This workload writes an optimised bundle, logs, or generated config into
    # its home directory at start-up, so a read-only root filesystem prevents it
    # from booting. Restricted Pod Security does not require one.
    checkov.io/skip4: CKV_K8S_22=upstream image writes to its home directory at start-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # logstash:9.1.0 runs as uid/gid 1000.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # movies.conf reads /data/movies.ndjson. Without this the K8s
        # cluster indexes zero movies. Download the catalogue from the
        # repo and convert it to NDJSON (same as start.sh does locally).
        - name: prepare-data
          image: python:3.12-alpine
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -f /data/movies.ndjson ]; then
                echo "Downloading movies.json.gz..."
                wget -q -O /data/movies.json.gz "https://raw.githubusercontent.com/An619/Elastiflix/main/data-loader/movies/movies.json.gz"
                python3 -c "import gzip, json; movies = json.load(gzip.open('/data/movies.json.gz', 'rt', encoding='utf-8')); open('/data/movies.ndjson', 'w', encoding='utf-8').write('\n'.join(json.dumps(m, ensure_ascii=False) for m in movies) + '\n'); print(f'{len(movies)} movies ready')"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: logstash # NOSONAR - official Elastic image, pinned to 9.1.0
          image: docker.elastic.co/logstash/logstash:9.1.0
          ports:
            - containerPort: 5044
              name: beats
          env:
            - name: ES_HOST
              value: "http://elasticsearch:9200"
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            # Logstash writes an optimised pipeline bundle and lock files into
            # its home directory at start-up.
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /
              port: beats
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: beats
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: beats
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
            - name: config
              mountPath: /usr/share/logstash/config/pipelines.yml
              subPath: pipelines.yml
            - name: logstash-yml
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: templates
              mountPath: /usr/share/logstash/templates
            - name: data
              mountPath: /data
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
        - name: config
          configMap:
            name: logstash-config
        - name: logstash-yml
          configMap:
            name: logstash-config
        - name: templates
          configMap:
            name: logstash-templates
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: elastic-stack
spec:
  selector:
    app: logstash
  ports:
    - port: 5044
      targetPort: 5044
      name: beats
