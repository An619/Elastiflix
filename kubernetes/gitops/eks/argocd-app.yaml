apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastiflix
  namespace: argocd
spec:
  project: elastiflix
  source:
    repoURL: "https://github.com/An619/Elastiflix.git"
    targetRevision: main
    path: kubernetes/environments/eks
  destination:
    server: "https://kubernetes.default.svc"
    namespace: elastiflix
  # Keep workload sync manual until the separately gated AWS Ingress is
  # approved, installed, and healthy. This prevents ALB traffic routing from
  # starting before its Ingress dependency exists.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
