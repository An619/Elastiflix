apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: elastiflix
  source:
    repoURL: "https://github.com/An619/Elastiflix.git"
    targetRevision: main
    path: kubernetes/aws/storage
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
