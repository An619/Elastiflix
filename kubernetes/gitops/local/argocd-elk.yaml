apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastic-stack
  namespace: argocd
spec:
  project: elastiflix
  source:
    repoURL: "https://github.com/An619/Elastiflix.git"
    targetRevision: arena/90ec80bf-elastiflix
    path: kubernetes/elastic-stack
  destination:
    server: "https://kubernetes.default.svc"
    namespace: elastic-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
