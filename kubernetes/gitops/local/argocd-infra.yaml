apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-databases
  namespace: argocd
spec:
  project: elastiflix
  source:
    repoURL: "https://github.com/An619/Elastiflix.git"
    targetRevision: arena/90ec80bf-elastiflix
    path: kubernetes/infra
    directory:
      exclude: "*-sealedsecret.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
