apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-network-policy
  namespace: argocd
spec:
  project: elastiflix
  source:
    repoURL: "https://github.com/An619/Elastiflix.git"
    targetRevision: arena/90ec80bf-elastiflix
    path: kubernetes/monitoring
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
