# --- REDIS ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: infra
  annotations:
    # See docs/security/phase-2-kubernetes-hardening.md for the rationale shared
    # by these three exceptions.
    checkov.io/skip1: CKV_K8S_43=upstream image tag is reviewed but digest pinning needs registry access from CI
    checkov.io/skip2: CKV_K8S_15=static reviewed upstream tag; floating tags are not used for the application images
    checkov.io/skip3: CKV_K8S_40=upstream image hard-codes its unprivileged runtime uid 999
    checkov.io/skip4: CKV_K8S_22=rabbitmq writes generated config and the Erlang cookie into /etc/rabbitmq at start-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # redis:7-alpine runs as the unprivileged `redis` user (uid/gid 999).
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          # Explicit mapping: the Secret key is `redis-password`, but the
          # redis-server command expands $(REDIS_PASSWORD). envFrom would
          # export `redis-password` verbatim and the password would stay
          # the literal string "$(REDIS_PASSWORD)".
          command:
            - sh
            - -c
            # The password is read from a mounted Secret file, never from an
            # environment variable or an argv, and rendered into a 0600 config
            # file that is discarded with the pod.
            - |
              set -eu
              umask 077
              password=$(cat /run/secrets/redis/redis-password)
              [ -n "$password" ] || { echo "redis password is empty" >&2; exit 1; }
              printf 'requirepass %s\n' "$password" > /tmp/redis.conf
              exec redis-server /tmp/redis.conf --appendonly yes
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              # /tmp is an emptyDir and /run/secrets/redis is a tmpfs Secret
              # mount; both are backed by the node's ephemeral storage. A limit
              # here bounds what a runaway redis process can write to the node.
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "250m"
              # Must exceed emptyDir.sizeLimit below, or the pod is rejected by
              # the kubelet before it starts.
              ephemeral-storage: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command:
                [
                  "sh",
                  "-c",
                  'REDISCLI_AUTH="$(cat /run/secrets/redis/redis-password)" redis-cli ping | grep -q PONG',
                ]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                [
                  "sh",
                  "-c",
                  'REDISCLI_AUTH="$(cat /run/secrets/redis/redis-password)" redis-cli ping | grep -q PONG',
                ]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: redis-secret
              mountPath: /run/secrets/redis
              readOnly: true
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: redis-secret
          secret:
            secretName: redis-secret
            items:
              - key: redis-password
                path: redis-password
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: infra
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis
      name: redis


# --- RABBITMQ ---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: infra
  annotations:
    checkov.io/skip1: CKV_K8S_43=upstream image tag is reviewed but digest pinning needs registry access from CI
    checkov.io/skip2: CKV_K8S_15=static reviewed upstream tag; floating tags are not used for the application images
    checkov.io/skip3: CKV_K8S_40=upstream image hard-codes its unprivileged runtime uid 999
    checkov.io/skip4: CKV_K8S_22=rabbitmq writes generated config and the Erlang cookie into /etc/rabbitmq at start-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The rabbitmq image ships uid/gid 999 for the `rabbitmq` user.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              password=$(cat /run/secrets/rabbitmq/rabbitmq-password)
              [ -n "$password" ] || { echo "rabbitmq password is empty" >&2; exit 1; }
              cat > /etc/rabbitmq/conf.d/10-elastiflix.conf <<CONF
              default_user = user
              default_pass = ${password}
              CONF
              exec docker-entrypoint.sh rabbitmq-server
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              memory: "512Mi"
              # RabbitMQ stages message and mnesia data under /tmp during
              # start-up and shutdown; keep this above emptyDir.sizeLimit.
              ephemeral-storage: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            # Deliberately not read-only: RabbitMQ writes generated config and
            # the Erlang cookie into /etc/rabbitmq at start-up. Restricted PSA
            # does not require a read-only root filesystem, so this does not
            # weaken the enforced pod security profile.
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: tmp
              mountPath: /tmp
            - name: rabbitmq-secret
              mountPath: /run/secrets/rabbitmq
              readOnly: true
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: rabbitmq-secret
          secret:
            secretName: rabbitmq-secret
            items:
              - key: rabbitmq-password
                path: rabbitmq-password
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: infra
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      name: amqp
      targetPort: amqp
    - port: 15672
      name: management
      targetPort: management
