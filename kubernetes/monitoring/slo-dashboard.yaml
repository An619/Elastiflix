# Grafana dashboard for the availability SLO.
#
# Delivered as a ConfigMap labelled grafana_dashboard=1, which the Grafana
# sidecar configured in kubernetes/argocd-monitoring.yaml discovers
# (searchNamespace: ALL). Every panel queries a recording rule or a series the
# backend actually exports; an empty panel means "not scraped", which the
# ElastiflixBackendMetricsMissing alert covers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: elastiflix-slo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  elastiflix-slo.json: |-
    {
      "uid": "elastiflix-slo",
      "title": "Elastiflix SLO and Error Budget",
      "tags": ["elastiflix", "slo"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-7d", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Rolling 7-day availability",
          "description": "1 - (7d 5xx rate / 7d request rate), excluding /healthz. Proposal only, not an external SLA.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "elastiflix:slo_availability:ratio7d", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 3, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.995}, {"color": "green", "value": 0.998}]}}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error budget remaining",
          "description": "1 means the full 0.5% budget for the 7-day window is unspent.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "elastiflix:slo_error_budget_remaining:ratio7d", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 2, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.25}, {"color": "green", "value": 0.5}]}}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 0}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Requests in window",
          "description": "Requests counted over the 7-day window. Small numbers make the ratio noisy.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "elastiflix:slo_requests:increase7d", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 0}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "5xx ratio (5m and 1h)",
          "description": "Burn-rate windows used by the fast-burn alert.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "elastiflix:error_ratio:rate5m", "legendFormat": "5m", "refId": "A"},
            {"expr": "elastiflix:error_ratio:rate1h", "legendFormat": "1h", "refId": "B"}
          ],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests and errors per second",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "elastiflix:requests:rate5m", "legendFormat": "requests/s", "refId": "A"},
            {"expr": "elastiflix:errors:rate5m", "legendFormat": "5xx/s", "refId": "B"}
          ],
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency p95 by route",
          "description": "From the elastiflix_http_request_duration_seconds histogram.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum(rate(elastiflix_http_request_duration_seconds_bucket[5m])) by (le, route))", "legendFormat": "{{route}}", "refId": "A"}
          ],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Cache hit ratio",
          "description": "Cache hits per search request; zero when Redis is not configured.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum(rate(elastiflix_cache_hits_total[5m])) / clamp_min(sum(rate(elastiflix_search_requests_total[5m])), 0.001)", "legendFormat": "hits/searches", "refId": "A"}
          ],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14}
        }
      ]
    }
