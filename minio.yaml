apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: velero
type: Opaque
stringData:
  # Placeholder only — replace before applying, e.g.:
  #   kubectl create secret generic minio-credentials -n velero \
  #     --from-literal=MINIO_ROOT_USER=... --from-literal=MINIO_ROOT_PASSWORD=...
  MINIO_ROOT_USER: "CHANGE_ME"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: velero
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # MinIO talks to no Kubernetes API, and no RoleBinding grants the `velero`
      # namespace's default ServiceAccount anything, so a mounted token would be
      # a credential with no use that only adds a way to steal one.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # pgsty/silo is MinIO-derived and runs as uid 1000 in its published image.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
            - containerPort: 9001
          # A memory limit is what stops one demo object store from taking the
          # node down with it. CPU is left as a request-with-headroom limit so
          # start-up is not throttled.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # readOnlyRootFilesystem above makes every writable path explicit.
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # This manifest previously declared no volumes at all: MinIO wrote to
        # /data inside the container's writable layer. readOnlyRootFilesystem
        # above requires an explicit mount, so /data becomes a bounded emptyDir.
        # Stored objects are lost when the pod is replaced - the same outcome as
        # before, since the container layer was never durable either.
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: velero
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      name: api
    - port: 9001
      name: console
