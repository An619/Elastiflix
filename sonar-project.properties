sonar.projectKey=An619_Elastiflix
sonar.organization=an619
sonar.projectName=Elastiflix
# `scripts/` is analysed because two of those scripts decide whether CI passes
# (the Checkov report gate and the observability validator).
sonar.sources=frontend/src, backend/src, data-loader, scripts
sonar.exclusions=**/node_modules/**, **/build/**, **/coverage/**, **/*.test.js, \
    **/__tests__/**, frontend/src/setupTests.js, data-loader/test_*.py
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
sonar.python.coverage.reportPaths=data-loader/coverage-python.xml,scripts/coverage-scripts.xml
# Test fixtures and entry points that only wire modules together: left out of
# the coverage denominator, still analysed for bugs and vulnerabilities.
sonar.coverage.exclusions=**/node_modules/**, **/build/**, **/coverage/**, \
    **/__tests__/**, backend/test/**, **/*.test.js, frontend/src/setupTests.js, \
    frontend/src/index.js, frontend/src/services/SearchConnector.js, \
    data-loader/test_*.py
